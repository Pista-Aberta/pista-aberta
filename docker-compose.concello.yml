# Pista Aberta — instalación dun concello (produción).
# Uso: ./install.sh  →  docker compose -f docker-compose.concello.yml --env-file .env.install up -d --build
# Sen Mailpit. Todo por variable. Caddy con HTTPS automático (Let's Encrypt).
# A demo VPS segue a usar docker-compose.vps.yml (+ dominio.yml).

name: pista-aberta-concello

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pista
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}
      POSTGRES_DB: pista_aberta
    volumes:
      - pista_concello_pgdata:/var/lib/postgresql/data
    networks:
      - pista_concello
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pista -d pista_aberta"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://pista:${POSTGRES_PASSWORD}@postgres:5432/pista_aberta
      FORCE_POSTGRES: "1"
      API_HOST: 0.0.0.0
      API_PORT: 3001
      TZ: Europe/Madrid
      APP_BASE_URL: ${APP_BASE_URL}
      API_BASE_URL: ${API_BASE_URL:-${APP_BASE_URL}}
      SESSION_SECRET: ${SESSION_SECRET}
      CERT_GATEWAY_SECRET: ${CERT_GATEWAY_SECRET:-}
      CERT_LOGIN_ENABLED: ${CERT_LOGIN_ENABLED:-1}
      CERT_ORIGIN: ${CERT_ORIGIN:-https://cert.${DOMAIN}}
      PA_DEMO: ${PA_DEMO:-0}
      NODE_ENV: ${NODE_ENV:-production}
      PA_SINGLE_MUNI: ${PA_SINGLE_MUNI:-}
      VITE_PA_SINGLE_MUNI: ${VITE_PA_SINGLE_MUNI:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SAML_VALIDATE_IN_RESPONSE_TO: ${SAML_VALIDATE_IN_RESPONSE_TO:-always}
      SAML_ALLOW_DEMO_CERTS: ${SAML_ALLOW_DEMO_CERTS:-}
      SAML_SP_ENTITY_ID: ${SAML_SP_ENTITY_ID:-}
      SAML_IDP_ENTITY_ID: ${SAML_IDP_ENTITY_ID:-}
      SAML_IDP_SSO_URL: ${SAML_IDP_SSO_URL:-}
      SAML_CALLBACK_URL: ${SAML_CALLBACK_URL:-}
      SAML_CERTS_DIR: ${SAML_CERTS_DIR:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      CERT_OCSP_REQUIRED: "1"
      CERT_OCSP_CA_BUNDLE: /etc/pa/trusted-client-cas.official.pem
    volumes:
      - ${SAML_CERTS_HOST_DIR:-./deploy/concello/saml-certs}:/app/apps/api/certs:ro
      - ./deploy/dominio/ca/trusted-client-cas.official.pem:/etc/pa/trusted-client-cas.official.pem:ro
      - ./deploy/demo-ca:/ca-demo:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pista_concello
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ""
        VITE_PA_DEMO: ${VITE_PA_DEMO:-0}
        VITE_PA_SINGLE_MUNI: ${VITE_PA_SINGLE_MUNI:-}
    networks:
      - pista_concello
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN obrigatorio}
      ACME_EMAIL: ${ACME_EMAIL:-admin@${DOMAIN}}
      CERT_GATEWAY_SECRET: ${CERT_GATEWAY_SECRET:?CERT_GATEWAY_SECRET obrigatorio}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/concello/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/dominio/ca/trusted-client-cas.official.pem:/etc/caddy/trusted-client-cas.official.pem:ro
      - pista_concello_caddy_data:/data
      - pista_concello_caddy_config:/config
    depends_on:
      - api
      - web
    networks:
      - pista_concello
    restart: unless-stopped

  # REVISION-40 N6 — copias diarias (activar con --profile backup ou COMPOSE_PROFILES=backup)
  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - pista_concello_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pista_concello
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "[backup] servizo activo (dump diario ~03:15 UTC)"
        while true; do
          HOUR=$$(date -u +%H)
          MIN=$$(date -u +%M)
          if [ "$$HOUR" = "03" ] && [ "$$MIN" -ge 15 ] && [ "$$MIN" -lt 20 ]; then
            STAMP=$$(date -u +%Y%m%dT%H%M%SZ)
            OUT=/backups/pista-$$STAMP.dump
            echo "[backup] $$OUT"
            pg_dump -h postgres -U pista -d pista_aberta -Fc > "$$OUT"
            find /backups -name 'pista-*.dump' -mtime +$${KEEP_DAYS} -delete 2>/dev/null || true
            sleep 600
          fi
          sleep 60
        done

  # Perfil demo-ocsp: respondedor local (npm run demo-ca) + test: docker compose … exec api npm run test:ocsp
  pa-ocsp-demo:
    image: alpine:3.20
    profiles:
      - demo-ocsp
    command: sh -c "apk add --no-cache openssl >/dev/null && openssl ocsp -port 2560 -index /ca/index.txt -CA /ca/demo-ca.pem -rsigner /ca/ocsp.pem -rkey /ca/ocsp.key -nmin 5"
    volumes:
      - ./deploy/demo-ca:/ca:ro
    networks:
      - pista_concello
    ports:
      - "127.0.0.1:2560:2560"
    restart: unless-stopped

networks:
  pista_concello:
    driver: bridge

volumes:
  pista_concello_pgdata:
  pista_concello_caddy_data:
  pista_concello_caddy_config:
  pista_concello_backups:

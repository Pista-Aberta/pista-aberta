description:
  gl:
    shortDescription: >-
      Plataforma libre de xestión e reserva de instalacións deportivas municipais.
    longDescription: >-
      Pista Aberta permite aos concellos galegos xestionar e ofrecer en liña
      as súas instalacións deportivas: consulta, reserva con QR, panel municipal
      e módulo de pavillóns/clubs. Multi-concello, autoaloxable (Docker Compose),
      autenticación con certificado dixital (FNMT/DNIe, mTLS+OCSP), Cl@ve
      (SAML 2.0 eIDAS) e correo+OTP. Inclúe partidos abertos («busco xente»).
    features:
      - Reserva cidadá con QR
      - Multi-concello
      - Módulo de pavillóns e clubs
      - Certificado dixital FNMT/DNIe (mTLS + OCSP)
      - Acceso SAML (Cl@ve demo) e correo+OTP
      - Partidos abertos
  es:
    shortDescription: >-
      Plataforma libre de gestión y reserva de instalaciones deportivas municipales.
    longDescription: >-
      Pista Aberta permite a los concellos gallegos gestionar y ofrecer en línea
      sus instalaciones deportivas. Multi-concello, autoalojable, autenticación
      con certificado digital (FNMT/DNIe, mTLS+OCSP), Cl@ve (SAML 2.0 eIDAS) y
      correo+OTP. Incluye partidos abiertos («busco gente»).
    features:
      - Reserva ciudadana con QR
      - Multi-concello
      - Módulo de pabellones y clubs
      - Certificado digital FNMT/DNIe (mTLS + OCSP)
      - Acceso SAML (Cl@ve demo) y correo+OTP
      - Partidos abiertos

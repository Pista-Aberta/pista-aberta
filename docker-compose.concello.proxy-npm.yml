# Modo Nginx Proxy Manager: sen Caddy e sen porto no host.
# A app (servizo edge) únese á rede Docker de NPM; apunta o proxy a «edge:80».
# Require PROXY_NETWORK (p.ex. nginxproxymanager_default).
# Uso (install.sh):
#   docker compose -f docker-compose.concello.yml \
#     -f docker-compose.concello.proxy-npm.yml --env-file .env.install up -d --build

services:
  caddy:
    profiles: ["__disabled_caddy__"]

  edge:
    image: nginx:1.27.5-alpine
    volumes:
      - ./deploy/concello/nginx-edge.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    networks:
      - pista_concello
      - proxy_external
    restart: unless-stopped

networks:
  proxy_external:
    external: true
    name: ${PROXY_NETWORK:?PROXY_NETWORK obrigatorio no modo NPM}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed assets: long cache (filename includes content hash).
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # SPA shell must never be cached across deploys (stale index → missing chunks).
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # TANDA-1 — widget iframe (frame-ancestors *)
  location ~ ^/c/[^/]+/widget(/.*)?$ {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors *; base-uri 'self'" always;
  }

  location / {
    try_files $uri /index.html;
  }
}

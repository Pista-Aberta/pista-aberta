# Override para instalación «detrás dun servidor web existente».
# Sen Caddy: edge HTTP en 127.0.0.1:${APP_PORT} (ou só rede Docker se PROXY_NETWORK está definido).
# Uso (install.sh):
#   docker compose -f docker-compose.concello.yml -f docker-compose.concello.proxy.yml \
#     --env-file .env.install up -d --build

services:
  caddy:
    # Desactiva Caddy neste modo (perfil que nunca se activa).
    profiles: ["__disabled_caddy__"]

  edge:
    image: nginx:1.27.5-alpine
    ports:
      - "${PROXY_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    volumes:
      - ./deploy/concello/nginx-edge.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    networks:
      - pista_concello
    restart: unless-stopped
